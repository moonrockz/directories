name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        env:
          # The postinstall hook installs MoonBit with a bash script, which
          # does not work on Windows. setup-moonbit below installs it instead.
          MISE_NO_HOOKS: "1"
        with:
          install: true
          cache: true

      - name: Export pinned MoonBit version
        shell: bash
        run: |
          version="$(mise env --json | jq -er .MOONBIT_INSTALL_VERSION)"
          echo "MOONBIT_INSTALL_VERSION=$version" >> "$GITHUB_ENV"

      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_INSTALL_VERSION }}
          core-version: ${{ env.MOONBIT_INSTALL_VERSION }}

      - name: Install dependencies
        run: moon update

      - name: Check formatting
        run: |
          moon fmt
          git diff --exit-code || (echo "::error::moon fmt produced changes — run 'moon fmt' locally and commit" && exit 1)

      - name: Check code
        run: moon check

  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        env:
          # The postinstall hook installs MoonBit with a bash script, which
          # does not work on Windows. setup-moonbit below installs it instead.
          MISE_NO_HOOKS: "1"
        with:
          install: true
          cache: true

      - name: Export pinned MoonBit version
        shell: bash
        run: |
          version="$(mise env --json | jq -er .MOONBIT_INSTALL_VERSION)"
          echo "MOONBIT_INSTALL_VERSION=$version" >> "$GITHUB_ENV"

      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_INSTALL_VERSION }}
          core-version: ${{ env.MOONBIT_INSTALL_VERSION }}

      - name: Install dependencies
        run: moon update

      - name: Install native build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q http://archive.ubuntu.com/ubuntu/pool/universe/libb/libbacktrace/libbacktrace0_0.1-4build1_amd64.deb
          wget -q http://archive.ubuntu.com/ubuntu/pool/universe/libb/libbacktrace/libbacktrace-dev_0.1-4build1_amd64.deb
          sudo dpkg -i libbacktrace0_0.1-4build1_amd64.deb libbacktrace-dev_0.1-4build1_amd64.deb

      - name: Run unit tests (wasm)
        run: moon test --target wasm

      - name: Run unit tests (wasm-gc)
        run: moon test --target wasm-gc

      - name: Run unit tests (js)
        run: moon test --target js

      - name: Run unit tests (native)
        run: moon test --target native

  # The only check that the main branch ruleset requires, so job renames and
  # new jobs need no settings change. Add every new job to `needs`.
  #
  # `if: always()` is required: without it this job is skipped when a needed
  # job fails, and GitHub counts a skipped required check as passed. Failed
  # and cancelled jobs fail it.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - lint
      - unit-tests
    steps:
      - name: Check that every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::Some CI jobs did not pass"
            echo "$failed"
            exit 1
          fi
          echo "All CI jobs passed or were skipped."
